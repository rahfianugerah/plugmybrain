# Laptop dev. Compose reads this automatically, so `docker compose up -d` here brings up
# Postgres alone and the CLI runs natively against it. The VM never has this file.
services:
  cognee-mcp:
    # On the laptop the agents talk to the VM, not to a second MCP server. Zero replicas keeps
    # the service defined but not running, so the compose file stays identical on both hosts.
    deploy:
      replicas: 0

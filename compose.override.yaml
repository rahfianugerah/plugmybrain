# Laptop dev. Compose reads this automatically; the VM never has this file.
#
# The full stack runs here, MCP server included, so `docker compose up -d` gives a working
# brain with no VM and no tunnel. The tunnel only becomes relevant once the same stack is
# running somewhere else and this machine needs to reach it.
services:
  postgres:
    # !override, not a plain list: compose merges `ports` by appending, so without it this
    # adds 15432 and keeps 5432, and the bind still fails on a machine that owns 5432.
    ports: !override
      # 15432, because a development machine usually already runs Postgres on 5432. This also
      # matches DB_PORT in .env.example, which is 15432 for the laptop either way: local
      # container now, forwarded from the VM later.
      - "127.0.0.1:${DB_PUBLISH_PORT:-15432}:5432"

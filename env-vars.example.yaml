# The `cloud` profile's --env-vars-file. Copy to env-vars.yaml, fill in, keep it gitignored.
# Every value is quoted: an unquoted colon or a stray tab fails the deploy with a YAML parse
# error rather than a useful message.
BRAIN_PROFILE: "cloud"
CLOUDSQL_INSTANCE: "PROJECT:REGION:INSTANCE"
DB_HOST: "127.0.0.1"
DB_PORT: "5432"
DB_NAME: "brain"
DB_USERNAME: "brain"
DB_PASSWORD: ""
EMBEDDING_PROVIDER: "voyage"
EMBEDDING_MODEL: "voyage/voyage-3.5"
EMBEDDING_DIMENSIONS: "1024"
EMBEDDING_API_KEY: ""
LLM_PROVIDER: "anthropic"
LLM_MODEL: "anthropic/claude-haiku-4-5-20251001"
LLM_API_KEY: ""
POOL_ARGS: '{"pool_size": 2, "max_overflow": 3}'
VECTOR_POOL_ARGS: '{"pool_size": 2, "max_overflow": 2}'

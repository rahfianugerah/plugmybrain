# The whole system: Postgres, and the MCP server that digests, searches and maps.
# Nothing binds anything but loopback.
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-plugmybrain}
      POSTGRES_USER: ${DB_USERNAME:-plugmybrain}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    # Sized for 2 GiB; raise together with the machine, not on their own
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - effective_cache_size=768MB
      - -c
      - max_connections=20
    ports:
      # A variable, because a machine already running Postgres owns 5432
      - "127.0.0.1:${DB_PUBLISH_PORT:-5432}:5432"
    volumes:
      # /var/lib/postgresql, not .../data: from 18 the image stores data per major version
      - pmb-pgdata:/var/lib/postgresql
      # Runs once on an empty data directory
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/10-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-plugmybrain} -d ${DB_NAME:-plugmybrain}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "plugmybrain.server"]
    env_file: .env
    environment:
      # Another host only when Postgres runs elsewhere, such as through the tunnel
      DB_HOST: ${PMB_DB_HOST:-postgres}
      DB_PORT: ${PMB_DB_PORT:-5432}
      # cognee's own state, which must outlive a restart
      DATA_ROOT_DIRECTORY: /data/cognee
      SYSTEM_ROOT_DIRECTORY: /data/cognee-system
      REQUIRE_AUTHENTICATION: "false"
      ENABLE_BACKEND_ACCESS_CONTROL: "false"
      PMB_DOCS: /docs
      PMB_GRAPH_DIR: /app/graph
      # The host path, to map an agent's folder onto the mount below
      PMB_WORKSPACE: ${PMB_WORKSPACE}
      PMB_WORKSPACE_MOUNT: /workspace
    # Ollama on the host, on Linux as well as Docker Desktop
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The server plus one digest; Docker stops it before the kernel picks Postgres
    mem_limit: 1500m
    ports:
      # 9000, because 8000 is every dev server's default
      - "127.0.0.1:${MCP_PUBLISH_PORT:-9000}:8000"
    volumes:
      - pmb-cognee:/data
      # Every project the server may digest, read-only: it never writes into one
      - ${PMB_WORKSPACE:?set PMB_WORKSPACE in .env}:/workspace:ro
      # The Obsidian vault, the one place generated notes are written
      - ${PMB_DOCS:-../docs}:/docs
      # Graphify's graph.json, readable from the host as well
      - ./graph:/app/graph
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pmb-pgdata:
  pmb-cognee:

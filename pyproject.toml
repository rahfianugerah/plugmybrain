# Package metadata and tool config. The environment itself is `environment.yml`.
[project]
name = "brain"
version = "0.1.0"
description = "A plug-and-play memory brain: Graphify code maps, Cognee knowledge graph, Obsidian control plane"
requires-python = ">=3.13"

[project.scripts]
brain = "brain.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["brain*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

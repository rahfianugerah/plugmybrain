# The `env` conda environment. Profile-agnostic: identical for local and cloud.
#
# Tools come from conda-forge; the application tree comes from pip. Splitting them that way
# avoids the conda and pip resolvers fighting over cognee's transitive dependencies, which is
# the usual way a mixed environment breaks.
name: env
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.13
  - pip
  - ruff
  - pytest
  - pip:
      # postgres-binary, not postgres: the plain extra builds psycopg2 from source and needs
      # pg_config plus a compiler. The binary extra is prebuilt wheels.
      - cognee[postgres-binary]==1.4.2
      # The MCP server is plugmybrain/server.py, not cognee-mcp. 2.x because FastMCP was renamed
      # to MCPServer and moved to mcp.server.mcpserver, which is what that file imports.
      - mcp>=2.0.0,<3.0.0
      - graphifyy==0.9.38
      - asyncpg
      - python-dotenv
